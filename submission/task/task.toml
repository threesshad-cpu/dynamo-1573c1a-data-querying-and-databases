schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing and substitute parts."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 2.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates complex multi-level MRP (Material Requirements Planning) simulation in SQLite combining top-down BOM DAG explosion, routing workcenter labor/machine capacity limits, fixed batch setup scrap, component substitute part conversions (ratio & preference rank), batch_size lot rounding, leftover sub-assembly stock crediting, and sequential shared-pool priority allocation. Requires identifying binding bottleneck resources across heterogeneous constraints (raw leaf materials vs workcenters) for partially fulfilled orders. MRP systems engineers, ERP architects, and supply chain analysts solve this problem to optimize production scheduling under constrained multi-resource environments. The underlying dataset is synthetic (generated via environment/generate_data.py) and hand-constructed to be realistically challenging with multiple binding bottlenecks across heterogeneous resources."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements, checking primary stock and substitute stocks in preference rank order, enforcing batch_size lot rounding, calculating workcenter hours (setup + run hours per unit), and adding fixed setup scrap (setup_scrap_qty + ceil(build_qty * qty_per * (1 + scrap_pct/100))). Evaluates limiting resource bottleneck via minimum fulfillment ratio across raw leaf components and workcenters for next batch increment. Writes sorted report to /app/report.json."
verification_explanation = "Verifies exact match for allocated_qty, shortfall_qty, and limiting_resource across 7 orders in /app/report.json. Checks JSON structure (exactly one top-level key 'orders'), file existence, non-symlink status, order count of 7, and ascending order_id sort. Ensures multi-way sensitivity: ignoring routing workcenter capacities alters O02 allocation (25 vs 30), ignoring substitute part stocks alters O03 allocation/bottleneck, ignoring ASCII tie-breaking on tied ratios alters O03 limiting_resource (L5 vs WC2) and O05 limiting_resource (WC1 vs WC3), ignoring setup scrap alters component demand, ignoring batch_size constraints alters order lot rounding, and sequential shared-pool depletion across 7 orders creates distinct bottleneck cascades. O05 specifically tests workcenter-vs-workcenter ASCII tie-break (WC1 vs WC3 at ratio 0.50), providing a distinct tie-break category from O03's leaf-vs-workcenter tie."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

