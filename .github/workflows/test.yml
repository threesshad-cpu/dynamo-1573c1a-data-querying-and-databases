name: Corporate Graph Ownership Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib numpy pytest

    - name: Prepare /app directory permissions
      run: |
        sudo mkdir -p /app
        sudo chmod 777 /app

    - name: Generate synthetic RDF graph data
      run: |
        python environment/generate_data.py

    - name: Run solution script
      run: |
        bash solution/solve.sh

    - name: Run automated test suite
      run: |
        pytest tests/test_outputs.py
