schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates multi-level BOM explosion and sequential shared-inventory allocation on synthetic SQLite databases. Requires modeling top-down pre-built sub-assembly stock consumption, multi-level lot sizing (batch_size constraints on sub-assemblies and products), leftover sub-assembly stock propagation, non-linear ceiling scrap/yield loss calculations across DAG paths, sequential priority allocation, bottleneck raw component identification, and shared stock depletion. Production planners, MRP systems engineers, and supply-chain analysts solve this problem in manufacturing operations to determine build feasibility, allocate constrained raw materials across competing orders, and pinpoint binding component bottlenecks."
solution_explanation = "Reads SQLite database, simulates top-down BOM explosion consuming pre-built sub-assembly stock first and computing gross component requirements using ceiling scrap-loss (ceil(build_qty*(1+scrap_pct/100))). Enforces batch_size lot rounding on sub-assemblies (rounding net sub-assembly demand up to batch_size multiples) and credits excess sub-assemblies produced back to shared inventory. L1 (Bolt-M4) is a diamond dependency: consumed by SA1 (4/unit) AND SA2 (2/unit). Identifies bottleneck raw components via minimum initial-inventory-ratio, updates remaining inventory pools, and writes a sorted JSON report."
verification_explanation = "Verifies exact integer match for allocated quantities, shortfall quantities, and limiting component IDs across 7 orders. Seals top-level JSON schema (exactly one key 'orders'). Checks file existence, non-symlink status, array count of 7, and order_id ascending sort. Sub-assembly lot sizing, leftover sub-assembly stock crediting, and ceiling scrap rounding ensure multi-way sensitivity: ignoring sub-assembly batch_size alters O2 allocated_qty (2 vs 6), ignoring leftover sub-assembly stock alters O4 limiting_component (L3 vs L6), and using floor scrap alters O1 limiting_component (L3 vs L1)."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

