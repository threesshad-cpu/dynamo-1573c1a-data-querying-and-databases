schema_version = "1.0"
artifacts = [ "/app/report.json",]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze a multi-level manufacturing BOM DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing, substitutes, deep shared sub-assemblies, and cancellation side effects."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = [ "analyze", "generate", "implement",]
artifact_type = [ "document_or_report", "generated_output_artifact",]
expert_time_estimate_hours = 2.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates a deterministic MRP simulation with interacting BOM-DAG constraints rather than isolated arithmetic cases. The dataset now contains the original six mechanics plus a second deep branch: a product reaches the same sub-assembly through both a direct edge and a nested sub-assembly, nested production consumes multiple workcenters, equal-rank substitutes compete for a shared leaf pool, and later orders depend on the exact state left by earlier orders. Two cancellation cases include immediate follow-up orders that expose accidental state consumption. The added branch deliberately combines shared-demand aggregation, sub-assembly netting, scrap, batch rounding, substitute conversion and tie-breaking, workcenter capacity, gross limiting-resource ratios, stateful depletion, and cancellation semantics. The synthetic instance remains deterministic and fully verifiable while requiring substantially more careful DAG traversal and state accounting."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements, aggregating shared demand, netting sub-assembly stock, enforcing batch-size lots and scrap, resolving substitutes by rank and ID, checking shared workcenter capacity, and computing gross limiting-resource ratios. Applies the documented sub-50% cancellation rule without committing state, including the later-order regression checks, then writes sorted results to /app/report.json."
verification_explanation = "Compares report.json against 13 explicit order results. O1-O7 preserve the original regression coverage. O8 adds a deeper shared-DAG case where SA3 is reached through both SA4 and a direct edge. O9 verifies cross-order depletion of the deep branch. O10 verifies equal-rank substitute selection plus batch rounding after prior depletion. O11 exercises a positive partial build below 50 percent and requires cancellation with L7 as the limiting resource. O12 immediately follows O11 and proves the canceled order consumed no L7 inventory. The verifier checks exact schema, order sorting, allocations, shortfalls, and limiting resources."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
