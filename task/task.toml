schema_version = "1.0"
artifacts = [ "/app/report.json",]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing and substitute parts."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = [ "analyze", "generate", "implement",]
artifact_type = [ "document_or_report", "generated_output_artifact",]
expert_time_estimate_hours = 2.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates complex multi-level MRP (Material Requirements Planning) simulation in SQLite combining top-down BOM DAG explosion, routing workcenter labor/machine capacity limits, fixed batch setup scrap, component substitute part conversions (ratio & preference rank), batch_size lot rounding, leftover sub-assembly stock crediting, and sequential shared-pool priority allocation. This task is designed to be mathematically coherent, focusing on 5 core principles: Aggregated BOM Explosion, Parent/SA Netting, Batch Rounding, Deterministic Substitution, and Gross Limiting Resource identification. The difficulty lies in implementing these 5 intersecting constraints correctly and extracting the correct binding bottleneck."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements (aggregating shared demand into a single run), checking primary stock and substitute stocks in preference rank order, enforcing batch_size lot rounding, calculating workcenter hours (setup + run hours per unit), and adding fixed setup scrap. Evaluates limiting resource bottleneck via minimum fulfillment ratio across raw leaf components and workcenters using gross propagated requirements. Writes sorted report to /app/report.json."
verification_explanation = "Compares the agent's report.json directly against the known-correct values for 4 explicit orders (O1 to O4). Each order explicitly tests one or more of the 5 core mechanics (e.g. O1 tests Batch Rounding and Netting, O2 tests Aggregated BOM Explosion, O3 tests Deterministic Substitution, O4 tests Gross Limiting Resource with an ASCII tie-breaker). The verifier strictly checks that the allocated quantity, shortfall, and limiting resource match."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
