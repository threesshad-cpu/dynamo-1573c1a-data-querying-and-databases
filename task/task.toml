schema_version = "1.0"
artifacts = [ "/app/report.json",]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze a multi-level manufacturing BOM DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing, substitutes, deep shared sub-assemblies, multi-parent demand aggregation, shared substitute contention, and cancellation side effects."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = [ "analyze", "generate", "implement",]
artifact_type = [ "document_or_report", "generated_output_artifact",]
expert_time_estimate_hours = 3.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates deterministic MRP simulation with interacting BOM-DAG constraints rather than isolated arithmetic cases. The dataset preserves the existing deep shared branches and multi-parent branch, then adds an adversarial shared-substitute contention case: one substitute pool is simultaneously eligible for two primary leaves, while one leaf has a private fallback. A greedy solver can consume the shared pool on the flexible leaf and strand the constrained leaf; a correct solver must reason globally about feasible allocation while preserving rank semantics. Later orders depend on the exact state left by earlier orders. The synthetic instance remains deterministic and fully verifiable while requiring careful DAG traversal, shared-demand aggregation, batch/scrap accounting, substitute conversion, global substitute-pool allocation, workcenter capacity checks, gross limiting-resource analysis, cancellation semantics, and stateful order processing."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements, aggregating shared demand across direct and nested parents, netting sub-assembly stock, enforcing batch-size lots and scrap, resolving substitutes by rank and ID, globally backtracking shared substitute pools when multiple primary leaves compete for the same stock, checking shared workcenter capacity, and computing gross limiting-resource ratios. Applies the documented sub-50% cancellation rule without committing state, including later-order regressions, then writes sorted results to /app/report.json."
verification_explanation = "Compares report.json against the explicit order results in task/tests/test_outputs.py. O1-O7 preserve the original regression coverage. O8 adds a deeper shared-DAG case where SA3 is reached through both SA4 and a direct edge. O9 verifies cross-order depletion of the deep branch. OA verifies equal-rank substitute selection plus batch rounding after prior depletion. OB exercises a positive partial build below 50 percent and requires cancellation with L7 as the limiting resource. OC immediately follows OB and proves the canceled order consumed no L7 inventory. O10C adds a multi-parent branch where SA5 is reached directly and through SA6, requiring one aggregated SA5 production run and exposing a WC5 capacity limit. O11 immediately follows O10C and proves the deep branch state is carried forward correctly. O12 tests exact application of the scrap formula aggregation. O3_N1 and O3_N2 test alphabetical tie-breaking for equal-rank substitutes. O15 and O15b test boundary cancellation conditions at exactly 50 percent and 49 percent respectively. O16 tests limiting resource tie-breaking with lexicographical sorting. O17 tests substitute quantity determination using strict floor semantics. O18 tests near-equal bottleneck ratios. O23 is an adversarial shared-substitute contention regression: the correct allocation must reserve the shared pool for the constrained primary leaf instead of greedily exhausting it on the flexible leaf. The verifier checks exact schema, lexicographic order sorting, allocations, shortfalls, and limiting resources."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
