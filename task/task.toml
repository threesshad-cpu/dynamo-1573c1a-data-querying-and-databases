schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing and substitute parts."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 2.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates complex multi-level MRP (Material Requirements Planning) simulation in SQLite combining top-down BOM DAG explosion, routing workcenter labor/machine capacity limits, fixed batch setup scrap, component substitute part conversions (ratio & preference rank), batch_size lot rounding, leftover sub-assembly stock crediting, and sequential shared-pool priority allocation. Requires identifying binding bottleneck resources across heterogeneous constraints (raw leaf materials vs workcenters) for partially fulfilled orders. MRP systems engineers, ERP architects, and supply chain analysts solve this problem to optimize production scheduling under constrained multi-resource environments. The underlying dataset is synthetic (generated via environment/generate_data.py) and hand-constructed to be realistically challenging with multiple binding bottlenecks across heterogeneous resources."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements, checking primary stock and substitute stocks in preference rank order, enforcing batch_size lot rounding, calculating workcenter hours (setup + run hours per unit), and adding fixed setup scrap (setup_scrap_qty + ceil(build_qty * qty_per * (1 + scrap_pct/100))). Evaluates limiting resource bottleneck via minimum fulfillment ratio across raw leaf components and workcenters for next batch increment. Writes sorted report to /app/report.json."
verification_explanation = "Verifies exact match for allocated_qty, shortfall_qty, and limiting_resource across 19 orders in /app/report.json. Checks JSON structure (exactly one top-level key 'orders'), file existence, non-symlink status, order count of 19, and ascending order_id sort. Processing order is O00_A, O00_B, O00_C, O00_D, O00_E, O00_F, O00_G, O00_H, O00_I, O00_J, O00_K, O00_L, O00_M, O01, O03, O02, O04, O05, O06 (priority ASC, order_id DESC tie-break). O00_A (P5 x3, batch=2, priority 0): needs 4 P5 requiring 10 SA5 (batch 10). SA5 needs 20 L10. Sub SUB_L10 floor(14/3)=4 effective. Fails allocation. Shortfall bottleneck calculates ratio for 2 P5. L10 floored ratio 0.200 < WC4 ratio 0.220. limiting=L10. Tests substitute floor precision vs floating point error. O00_B (P6 x10, priority 1): consumes 6 SUB_L12_A (pref 1, ratio 2.0) leaving 1, and 7 SUB_L12_B (pref 2, ratio 1.0) leaving 3. alloc=10. Tests strict preference rank cascading. O00_C (P7 x3, priority 2): allocates 3 using the 3 leftover SUB_L12_B correctly preserved by O00_B. O00_D (P8 x1, priority 3): builds 10 SA8 (batch 10), consumes 14 L13 (scrap 12.5%, +2 setup). credits 9 SA8 to inventory. O00_E (P9 x9, priority 4): uses 9 excess SA8 from inventory, skipping L13 requirement (which is now 0). alloc=9. Tests lot sizing excess crediting.  O01 (P2 x14, batch=4): allocates 12 (max batch multiple), shortfall 2, no bottleneck — tests batch-rounding floor. O03 (P3 x15, batch=2, priority 2): processes before O02 due to DESC tie-break; allocates 14, shortfall 1; consumes all remaining L5 (12 primary + floor(32/2)=16 substitute via SUB_L5) across SA2 builds for both O01 and O03; consumes WC3 hours (P3 routing 9.6h + SA4 routing 4.55h = 14.15h from 18.0h). O02 (P1 x30, batch=5, priority 2): processed after O03; L5 and SUB_L5 fully depleted by O01+O03, so zero SA2 can be built; allocates 0, shortfall 30, limiting=L5. O04 (P2 x20, batch=4): SA1 requires SA2 which requires L5 — still depleted; allocates 0, shortfall 20, limiting=L5. O05 (P4 x5, batch=3): dual-workcenter routing (WC1+WC3); WC3 only has ~3.85h remaining after O03 consumed 14.15h, but P4 needs 0.6+3*10.2=31.2h on WC3; allocates 0, shortfall 5, limiting=WC3. O06 (P3 x8, batch=2): uses 3 excess SA4 units credited from O03 lot rounding to build 2 units of P3 without needing SA2/L5; 4 units would require SA4 build triggering SA2 build needing L5 (depleted); allocates 2, shortfall 6, limiting=L5. O00_F verifies scrap ceiling. O00_G verifies WC setup+run hours. O00_H verifies initial-vs-leftover limiting-resource calc. O00_I verifies substitute integer conversion constraints. O00_J verifies leftover substitute consumption. O00_K verifies sub-assembly exclusion. O00_L verifies child-SA batch rounding. O00_M verifies ceil on scrap %."

