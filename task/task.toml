schema_version = "1.0"
artifacts = [ "/app/report.json",]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing and substitute parts."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = [ "analyze", "generate", "implement",]
artifact_type = [ "document_or_report", "generated_output_artifact",]
expert_time_estimate_hours = 2.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates complex multi-level MRP (Material Requirements Planning) simulation in SQLite combining top-down BOM DAG explosion, routing workcenter labor/machine capacity limits, fixed batch setup scrap, component substitute part conversions (ratio & preference rank), batch_size lot rounding, leftover sub-assembly stock crediting, sequential shared-pool priority allocation, and a positive-partial cancellation rule with zero state consumption. The task is mathematically coherent and focuses on intersecting domain constraints: Aggregated BOM Explosion, Parent/SA Netting, Batch Rounding, Deterministic Substitution, Gross Limiting Resource identification, and cancellation side-effect semantics. Difficulty comes from implementing these interacting constraints correctly and maintaining the exact inventory/capacity state across orders, including a later-order regression that exposes accidental consumption by a canceled order. The underlying dataset is a small deterministic synthetic MRP instance hand-engineered to exercise these mechanics. MRP systems engineers, ERP architects, and supply chain analysts routinely face this class of problem when optimizing production scheduling under constrained multi-resource environments — they must balance material availability, workcenter capacity, batch-rounding waste, substitute-part fallback, and cancellation policy simultaneously."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements (aggregating shared demand into a single run), checking primary stock and substitute stocks in preference rank order, enforcing batch_size lot rounding, calculating workcenter hours (setup + run hours per unit), and adding fixed setup scrap. Evaluates limiting resource bottleneck via minimum fulfillment ratio across raw leaf components and workcenters using gross propagated requirements. Applies the documented sub-50% cancellation rule without committing inventory or workcenter consumption, then writes sorted results to /app/report.json."
verification_explanation = "Compares the agent's report.json directly against the known-correct values for 8 explicit orders (O1, O2, O3, O3b, O4, O5, O6C, and O7). Each order explicitly tests one or more mechanics. O6C exercises the cancellation branch with a positive 40% maximum build and requires allocated_qty=0, full shortfall, and the correct limiting resource. O7 immediately follows O6C and verifies that the canceled order consumed no inventory. The verifier strictly checks schema, sorting, order values, and limiting resources."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
