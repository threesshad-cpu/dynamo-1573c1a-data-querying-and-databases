artifacts = ["/app/report.json"]

[task]
name = "dynamo/effective-ownership-risk"
description = "Analyze RDF corporate knowledge graph using matrix-based integrated ownership (Brioschi model) and propagate sanction risk."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement", "transform", "validate"]
artifact_type = ["database_or_structured_store", "document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates integrated corporate ownership and inherited sanctions risk on synthetic RDF Turtle graphs generated during environment build. Requires sanctions and KYC compliance analysts to model direct/indirect cross-holdings and solve linear systems V(I - C) = P for circular ownership, filter date-bounded sanctions, enforce exemption predicates, and output a sorted JSON report."
solution_explanation = "Parses RDF graph into parent and subsidiary sets, constructs parent-to-subsidiary (P) and subsidiary-to-subsidiary (C) direct ownership matrices, computes integrated ownership V = P * (I - C)^(-1) via matrix inversion, evaluates date-bounded parent sanctions, applies explicit exemption triples, and formats output report."
verification_explanation = "Verifies numeric integrated-ownership values after rounding to 4 decimal places; the report.json outputs are produced rounded to 4 decimals, therefore an absolute tolerance of 1e-4 is used (equivalent to an exact 4-decimal match). This choice bounds floating-point inversion variation (float64) while enforcing precise 4-decimal reporting. The verifier also checks ordering, array integrity, and date-bounded exemptions."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

