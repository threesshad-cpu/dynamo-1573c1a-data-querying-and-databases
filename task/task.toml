schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates multi-level BOM explosion and sequential shared-inventory allocation on synthetic SQLite databases. Requires modeling top-down pre-built sub-assembly stock consumption, non-linear ceiling scrap/yield loss calculations across DAG paths, lot size batch constraints, sequential priority allocation, bottleneck raw component identification, and shared stock depletion. Production planners, MRP systems engineers, and supply-chain analysts solve this problem in manufacturing operations to determine build feasibility, allocate constrained raw materials across competing orders, and pinpoint binding component bottlenecks."
solution_explanation = "Reads SQLite database, simulates top-down BOM explosion consuming pre-built sub-assembly stock first and computing gross component requirements using ceiling scrap-loss (ceil(qty*(1+scrap_pct/100))). L1 (Bolt-M4) is a diamond dependency: consumed by SA1 (4/unit, 0% scrap) AND SA2 (2/unit, 0% scrap); P1 requires both, so total L1 per P1 = 2*4+1*2=10, not 8. L3 scrap at 5.5% creates a rounding boundary at O0's SA1 explosion (ceil=5 vs floor=4) that propagates through 7 sequentially-allocated orders. Enforces batch_size lot rounding, identifies bottleneck raw components (L1, L3, or L5) via minimum initial-inventory-ratio, deducts consumed inventory, and writes a sorted JSON report."
verification_explanation = "Verifies exact integer match for allocated quantities, shortfall quantities, and limiting component IDs across 7 orders. Seals top-level JSON schema (exactly one key 'orders'). Checks file existence, non-symlink status, array count of 7, and order_id ascending sort. Three distinct limiting components (L1, L5, L3), four partial-or-fully-allocated orders, and non-zero O3 allocation (4 units) prevent hardcoding. The L1 diamond dependency and scrap boundary ensure mutation sensitivity: ceil->floor changes O3 and O6 limiting_component from L3 to L1."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

