schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates multi-level BOM explosion and sequential shared-inventory allocation on synthetic SQLite databases. Requires modeling top-down pre-built sub-assembly stock consumption, non-linear ceiling scrap/yield loss calculations across DAG paths, lot size batch constraints, sequential priority allocation, bottleneck raw component identification, and shared stock depletion. Production planners, MRP systems engineers, and supply-chain analysts solve this problem in manufacturing operations to determine build feasibility, allocate constrained raw materials across competing orders, and pinpoint binding component bottlenecks."
solution_explanation = "Reads SQLite database, simulates top-down BOM explosion consuming pre-built sub-assembly stock first and calculating ceil scrap losses, enforces batch_size lot rounding, identifies bottleneck raw components for shortfalls, deducts consumed inventory, and writes a sorted JSON report."
verification_explanation = "Verifies exact integer match for allocated quantities, shortfall quantities, and limiting component IDs across 5 orders. Checks output file existence, non-symlink status, JSON schema, array length, and order_id ascending sort order."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
