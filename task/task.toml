schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement", "transform", "validate"]
artifact_type = ["database_or_structured_store", "document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates multi-level BOM explosion and sequential shared-inventory allocation on synthetic SQLite databases generated during environment build. Requires domain knowledge in supply chain and manufacturing operations to model DAG reconvergence (components recurring across multiple assembly paths), process orders sequentially by priority, identify limiting raw components, and track shared inventory depletion."
solution_explanation = "Reads SQLite database, explodes product BOMs into total leaf component requirements per unit using memoized DAG traversal, sorts orders by priority and order_id, computes buildable units and bottleneck raw components against remaining shared inventory, deducts consumed stock, and writes a sorted JSON report."
verification_explanation = "Verifies exact integer match for allocated quantities, shortfall quantities, and limiting component IDs across all orders. Checks output file existence, non-symlink status, JSON schema, array length, and order_id ascending sort order."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
