schema_version = "1.0"
artifacts = [ "/app/report.json",]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze a multi-level manufacturing BOM DAG in SQLite and simulate sequential shared-inventory allocation across production orders with routing, substitutes, deep shared sub-assemblies, multi-parent demand aggregation, shared substitute contention, fractional substitute ratios, and cancellation side effects."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = [ "analyze", "generate", "implement",]
artifact_type = [ "document_or_report", "generated_output_artifact",]
expert_time_estimate_hours = 3.0
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates deterministic MRP simulation with interacting BOM-DAG constraints rather than isolated arithmetic cases. The dataset is synthetic, deliberately constructed in environment/generate_data.py to model realistic manufacturing inventory, routing, substitute, and order interactions while remaining deterministic and self-contained. The real-world audience is manufacturing and ERP production planners performing material-requirements planning (MRP), BOM netting, shortage analysis, and capacity-aware scheduling. The dataset contains deep shared branches, multi-parent aggregation, stateful cancellation, and a family of adversarial shared-substitute cases. O23 requires global allocation when one flexible leaf has a private fallback and another leaf has only the shared stock. O24 adds fractional conversion ratios on the same shared pool. O25 combines ranked shared stock with a private fallback. O26 requires a three-leaf global matching decision. O27 combines batch-size rounding, shared contention, and the strict sub-50-percent cancellation rollback. O28 moves the shared contention through two top-level subassemblies so demand must be aggregated before substitute allocation. These cases require careful DAG traversal, shared-demand aggregation, batch/scrap accounting, substitute conversion and ranking, global shared-pool feasibility, workcenter capacity, gross limiting-resource analysis, cancellation semantics, and stateful order processing."
solution_explanation = "Reads SQLite database /app/manufacturing.db, parses parts, bom, workcenters, routing, substitutes, and orders tables. Simulates sequential priority allocation by exploding top-down BOM DAG requirements, aggregating shared demand across direct and nested parents, netting sub-assembly stock, enforcing batch-size lots and scrap, resolving substitutes by rank and ID, globally backtracking shared substitute pools when multiple primary leaves compete for the same stock, checking shared workcenter capacity, and computing gross limiting-resource ratios. Applies the documented sub-50% cancellation rule without committing state, including later-order regressions, then writes sorted results to /app/report.json."
verification_explanation = "Compares report.json against the explicit order results in task/tests/test_outputs.py. O1 verifies parent netting and batch rounding. O2 verifies aggregated BOM explosion and shared-substitute depletion. O3 verifies ranked substitution, while O3_N1, O3_N2, and O3b cover equal-rank ordering and cross-order substitute depletion. O4 verifies gross limiting-resource analysis and lexicographic tie-breaking. O5 verifies stateful depletion. O6C and O7 verify sub-50-percent cancellation and that canceled work consumes no state. O8 and O9 cover deeper shared-BOM state carryover. OA covers equal-rank substitutes plus batch rounding. OB and OC cover deep cancellation and side-effect-free follow-up allocation. O10C and O11 cover multi-parent demand aggregation, shared subassembly production, capacity, and downstream state. O12 tests scrap arithmetic. O15 and O15b test the exact 50-percent and below-50-percent cancellation boundaries. O16 tests lexicographic resource tie-breaking. O17 tests floor substitution semantics. O18 tests near-equal bottleneck ratios. O23 tests two-leaf shared-pool contention. O24 tests fractional substitute ratios on one shared pool. O25 tests preference-ranked shared stock versus a private fallback. O26 tests three-leaf global matching with only one private fallback. O27 tests batch rounding plus below-50-percent cancellation rollback and limiting-resource preservation. O28 tests the same shared substitute pool across two independently required top-level subassemblies. The verifier checks exact schema, lexicographic order sorting, allocations, shortfalls, and limiting resources."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 3600.0

