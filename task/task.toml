schema_version = "1.0"
artifacts = ["/app/report.json"]

[task]
name = "dynamo/bom-shortage-cascade"
description = "Analyze multi-level manufacturing bill-of-materials (BOM) DAG in SQLite and simulate sequential shared-inventory allocation across production orders."

[metadata]
category = "data_querying_and_databases"
subcategory = "graph_and_semantic_queries"
task_objective = ["analyze", "generate", "implement"]
artifact_type = ["document_or_report", "generated_output_artifact"]
expert_time_estimate_hours = 1.5
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
difficulty_explanation = "Evaluates multi-level BOM explosion and sequential shared-inventory allocation on synthetic SQLite databases. Requires modeling top-down pre-built sub-assembly stock consumption, non-linear ceiling scrap/yield loss calculations across DAG paths, lot size batch constraints, sequential priority allocation, bottleneck raw component identification, and shared stock depletion. Production planners, MRP systems engineers, and supply-chain analysts solve this problem in manufacturing operations to determine build feasibility, allocate constrained raw materials across competing orders, and pinpoint binding component bottlenecks."
solution_explanation = "Reads SQLite database, simulates top-down BOM explosion consuming pre-built sub-assembly stock first and computing gross component requirements using ceiling scrap-loss (ceil(qty*(1+scrap_pct/100))) — critical because SA1->L3 at 5.5% scrap causes ceil(4*1.055)=5 vs floor=4 in O0's SA1 explosion, leaving L3=52 vs 53 after O0, which determines whether O1 can allocate 20 or 25 P1 units. Enforces batch_size lot rounding, identifies bottleneck raw components via minimum inventory-ratio, deducts consumed inventory, and writes a sorted JSON report."
verification_explanation = "Verifies exact integer match for allocated quantities, shortfall quantities, and limiting component IDs across 5 orders. Seals top-level JSON schema (exactly one key 'orders'). Checks file existence, non-symlink status, array length, and order_id ascending sort. The scrap-rate design (SA1->L3 at 5.5%, L3=81) ensures tests are mutation-sensitive: a ceil->floor substitution changes 3 output fields (O1 allocated_qty 20->25, O2 allocated_qty 14->8, O4 limiting_component L5->L3), making rounding errors immediately detectable."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

